<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>DIMON Agency</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --side:   #171b3a; --side-fg: #9aa2cc;
  --bg:     #f3f1fb; --card: #ffffff;
  --ink:    #161a36; --ink-2: #4b5277; --ink-3: #8d93b4;
  --line:   #e6e6f3;
  --blue:   #6c4ef0; --blue-s: #ece8fe;
  --ok:   #16a34a; --ok-s:   #dcfce7;
  --warn: #ea8a07; --warn-s: #fef3c7;
  --err:  #e11d48; --err-s:  #ffe4e6;
  --f:    'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sh:   0 1px 3px rgba(22,26,54,.05), 0 10px 30px rgba(22,26,54,.08);
  --sh-l: 0 6px 18px rgba(22,26,54,.1), 0 28px 60px rgba(22,26,54,.16);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px;
       -webkit-font-smoothing: antialiased }

.app { display: grid; grid-template-columns: 212px 1fr; min-height: 100vh }

/* ── Yon panel ── */
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column;
        padding: 20px 14px; gap: 22px; position: sticky; top: 0; height: 100vh }
.logo { display: flex; align-items: center; gap: 10px; padding: 0 6px }
.logo-m { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
          background: linear-gradient(145deg, #8b6bff, var(--blue)); flex-shrink: 0 }
.logo-t { font-weight: 800; font-size: 14px; color: #fff; line-height: 1.15; letter-spacing: -.02em }
.logo-t span { display: block; font-size: 9.5px; font-weight: 600; color: var(--side-fg); letter-spacing: .14em }
.nav { display: flex; flex-direction: column; gap: 3px }
.nav button { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px;
  color: var(--side-fg); background: none; border: none; width: 100%; text-align: left;
  font: 600 13px var(--f); cursor: pointer; transition: background .15s, color .15s }
.nav button:hover:not(.soon) { background: rgba(255,255,255,.06); color: #fff }
.nav button.on { background: var(--blue); color: #fff; box-shadow: 0 6px 16px rgba(108,78,240,.4) }
.nav button.soon { opacity: .4; cursor: default }
.side-b { margin-top: auto }
.who { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 12px;
       background: rgba(255,255,255,.05) }
.who .ava { width: 32px; height: 32px; border-radius: 10px; background: var(--blue);
            display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px }
.who-n { display: block; font-size: 12.5px; font-weight: 700; color: #fff; line-height: 1.2 }
.who-r { display: block; font-size: 10.5px; color: var(--side-fg) }

/* ── Asosiy ── */
.main { padding: 26px 30px 40px; min-width: 0 }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
       flex-wrap: wrap; margin-bottom: 24px }
.eyebrow { font-size: 11.5px; font-weight: 800; color: var(--blue); letter-spacing: .14em }
h1 { font-size: 34px; font-weight: 800; letter-spacing: -.035em; margin-top: 4px; line-height: 1.1 }
.rule { width: 46px; height: 4px; border-radius: 2px; background: var(--blue); margin-top: 8px }
.lead { color: var(--ink-2); font-size: 13.5px; margin-top: 12px; font-weight: 500 }
.tools { display: flex; align-items: center; gap: 10px }
.search { display: flex; align-items: center; gap: 9px; background: var(--card); border: 1px solid var(--line);
          border-radius: 999px; padding: 9px 16px; width: 250px; box-shadow: var(--sh) }
.search input { border: none; outline: none; font: 500 13px var(--f); width: 100%; background: none; color: var(--ink) }
.icon-b { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line);
          background: var(--card); display: grid; place-items: center; cursor: pointer;
          color: var(--ink-2); box-shadow: var(--sh); position: relative; flex-shrink: 0 }
.icon-b:hover { color: var(--blue) }
.icon-b .nuqta { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px;
                 border-radius: 50%; background: var(--err); border: 2px solid var(--card) }

.orqaga { display: inline-flex; align-items: center; gap: 7px; background: var(--card);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 15px; font: 700 12.5px var(--f);
  color: var(--ink-2); cursor: pointer; box-shadow: var(--sh); margin-bottom: 18px }
.orqaga:hover { color: var(--blue) }

/* ── Kartochkalar ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 20px }
.c { position: relative; border-radius: 20px; padding: 20px; overflow: hidden; cursor: pointer;
     background: var(--card); box-shadow: var(--sh); min-height: 262px;
     display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s }
.c:hover { transform: translateY(-3px); box-shadow: var(--sh-l) }
.c:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px }
.c-fon { position: absolute; inset: 0; opacity: .55 }
.c-rasm { position: absolute; right: -3%; bottom: 0; height: 96%; width: 44%; object-fit: cover;
  object-position: top center;
  -webkit-mask-image: linear-gradient(to right, transparent 2%, #000 42%);
  mask-image: linear-gradient(to right, transparent 2%, #000 42%) }
.c[data-xona="agentlar"] .c-rasm {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  height: 100%;
  aspect-ratio: 1 / 1;
  width: auto;
  object-fit: cover;
  object-position: center;
  border-radius: 0 20px 20px 0;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 5%);
  mask-image: linear-gradient(to right, transparent 0%, #000 5%);
}
.c[data-xona="agentlar"] .c-bot .c-btn {
  margin-left: 0;
  margin-right: auto;
  position: relative;
  z-index: 3;
}
.c[data-xona="agentlar"] .c-top,
.c[data-xona="agentlar"] .c-list,
.c[data-xona="agentlar"] .c-bot {
  max-width: 50%;
  position: relative;
  z-index: 2;
}

/* Fon va surat mutlaq turadi; qolganlari ular ustida */
.c > *:not(.c-fon):not(.c-rasm) { position: relative }
.c-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px }
.c-ico { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
         color: #fff; flex-shrink: 0; box-shadow: 0 5px 14px rgba(22,26,54,.18) }
.c-n { display: block; font-size: 16px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15 }
.c-s { display: block; font-size: 11.5px; color: var(--ink-2); font-weight: 600; margin-top: 1px }
.c-cnt { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
  background: rgba(255,255,255,.75); border: 1px solid rgba(22,26,54,.07);
  border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 700; color: var(--ink-2) }
.c-list { display: flex; flex-direction: column; gap: 6px; max-width: 62%; margin-bottom: 14px }
.c-li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600 }
.c-li i { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: block }
.c-li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.c-yana { font-size: 11.5px; color: var(--ink-3); font-weight: 600; padding-left: 15px }
.c-bot { margin-top: auto; display: flex; align-items: center; gap: 10px }
.stack { display: flex }
.stack > * { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--card);
  margin-left: -9px; object-fit: cover; object-position: center 20%; cursor: pointer; transition: transform .15s }
.stack > *:first-child { margin-left: 0 }
.stack > *:hover { transform: translateY(-3px) }
.stack .plus { background: var(--blue-s); color: var(--blue); display: grid; place-items: center;
               font-size: 11px; font-weight: 800 }
.c-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; background: #1c2040;
  color: #fff; border: none; border-radius: 999px; padding: 9px 16px; font: 700 12px var(--f); cursor: pointer }
.c-btn:hover { background: var(--blue) }

/* ── Loyiha / agent sahifasi ── */
.hero { position: relative; border-radius: 22px; overflow: hidden; background: var(--card);
        box-shadow: var(--sh); padding: 26px 28px; display: flex; gap: 24px; align-items: center;
        flex-wrap: wrap; margin-bottom: 20px }
.hero-fon { position: absolute; inset: 0 }
.hero > *:not(.hero-fon) { position: relative }
.hero-rasm { width: 132px; height: 132px; border-radius: 20px; object-fit: cover;
  object-position: center 18%; flex-shrink: 0; box-shadow: var(--sh) }
.hero-i { min-width: 0; flex: 1 }
.hero-n { font-size: 27px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1 }
.hero-s { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-top: 4px }
.hero-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 13px }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
        padding: 5px 13px; border-radius: 999px }
.link { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
  color: var(--blue); text-decoration: none; background: var(--blue-s); padding: 6px 14px; border-radius: 999px }
.link:hover { text-decoration: underline }

.kolon { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start }
@media (max-width: 980px) { .kolon { grid-template-columns: 1fr } }
.panel { background: var(--card); border-radius: 20px; box-shadow: var(--sh); overflow: hidden;
         margin-bottom: 20px }
.panel-h { display: flex; align-items: center; gap: 9px; padding: 16px 20px 13px; font-weight: 800;
           font-size: 14px; border-bottom: 1px solid var(--line) }
.panel-b { padding: 18px 20px }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px }
.stat { background: #f8f8fd; border-radius: 14px; padding: 13px 15px }
.stat-k { font-size: 10.5px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase }
.stat-v { font-size: 20px; font-weight: 800; margin-top: 3px; letter-spacing: -.02em }
.stat-v small { font-size: 12px; font-weight: 700; color: var(--ink-3) }

.bar { display: flex; gap: 3px; align-items: flex-end; height: 44px; margin-top: 6px }
.bar i { flex: 1; min-width: 3px; border-radius: 2px; display: block; opacity: .92 }
.bar-l { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink-3);
         font-weight: 600; margin-top: 7px }

.r { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-top: 1px solid var(--line);
     cursor: pointer; transition: background .13s }
.r:hover { background: #faf9ff }
.r i { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0 }
.r-n { font-weight: 700; font-size: 13px }
.r-t { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); overflow-wrap: anywhere }
.r-m { margin-left: auto; text-align: right; flex-shrink: 0 }
.r-ms { display: block; font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 4px }

.mini { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 14px;
        background: #f8f8fd; cursor: pointer; margin-bottom: 9px }
.mini:hover { background: var(--blue-s) }
.mini-rasm { width: 42px; height: 42px; border-radius: 12px; object-fit: cover;
             object-position: center 18%; flex-shrink: 0 }
.mini-n { display: block; font-weight: 700; font-size: 13px }
.mini-r { display: block; font-size: 11px; color: var(--ink-3); font-weight: 600 }

/* Profilaktika — server resurslari va yaqinlashayotgan muddatlar */
.sal { margin-bottom: 20px }
.sal-r { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px }
.sal-k { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
         padding: 13px 15px; box-shadow: var(--sh) }
.sal-t { display: flex; align-items: center; justify-content: space-between; gap: 8px }
.sal-n { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .01em }
.sal-v { font-size: 19px; font-weight: 800; letter-spacing: -.02em; color: var(--ink) }
.sal-b { margin-top: 9px; height: 6px; border-radius: 99px; background: #eef0f6; overflow: hidden }
.sal-b i { display: block; height: 100%; border-radius: 99px }
.sal-m { margin-top: 8px; font-size: 11px; color: var(--ink-3); font-weight: 500 }
.sal-x { margin-top: 12px; display: flex; flex-direction: column; gap: 8px }
.sal-q { display: flex; align-items: flex-start; gap: 9px; background: var(--card);
         border: 1px solid var(--line); border-radius: 13px; padding: 10px 13px; font-size: 12.5px;
         color: var(--ink-2); font-weight: 500; box-shadow: var(--sh) }
.sal-q i { width: 8px; height: 8px; border-radius: 99px; flex-shrink: 0; margin-top: 5px }
.sal-q b { color: var(--ink); font-weight: 700 }
.sal-vaqt { margin-top: 10px; font-size: 10.5px; color: var(--ink-3); font-weight: 600;
            letter-spacing: .04em; text-transform: uppercase }

.bosh { padding: 34px 20px; text-align: center; color: var(--ink-3); font-size: 13px; line-height: 1.7 }
.bosh b { color: var(--ink-2) }

.b-ok { background: var(--ok-s); color: var(--ok) } .b-warn { background: var(--warn-s); color: var(--warn) }
.b-err { background: var(--err-s); color: var(--err) } .b-ochiq { background: #eef0f6; color: #727a9c }
.d-ok { background: var(--ok) } .d-warn { background: var(--warn) }
.d-err { background: var(--err) } .d-ochiq { background: #aeb5cd }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 10px;
          padding: 12px 16px; overflow-x: auto }
  .side-b, .nav button span { display: none }
  .nav { flex-direction: row }
  h1 { font-size: 26px }
  .main { padding: 20px 16px 30px }
  .search { width: 100%; min-width: 170px }
  .c-rasm { opacity: .45 }
}

/* ── Orbit Uslublari ── */

/*
 * Sarlavha qatori. Avval bu klasslarga umuman uslub yozilmagan edi, shuning
 * uchun brauzer ularni blok qilib, "Loyihalar" va to'xtatish tugmasi pastga
 * tushib qolardi. Endi bitta qator: chapda nom, o'ng yuqori burchakda tugma.
 */
.h-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 20px; flex-wrap: nowrap;
}
.h-top > div:first-child { min-width: 0 }
.h-ong { display: flex; align-items: center; gap: 10px; flex-shrink: 0 }
.crumb {
  font-size: 11px; font-weight: 800; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); white-space: nowrap;
}
.h-tit {
  margin-top: 5px; font-size: clamp(27px, 2.6vw, 35px); font-weight: 800;
  letter-spacing: -.03em; line-height: 1.08; color: var(--ink);
}
.h-sub { margin-top: 7px; font-size: 13.5px; font-weight: 500; color: var(--ink-2) }

.stage {
  position: relative;
  width: 100%;
  height: min(78vh, 760px);
  min-height: 520px;
  margin-top: 10px;
  border-radius: 20px;
  background: radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.08) 0%, rgba(99, 102, 241, 0.03) 45%, transparent 70%);
  overflow: hidden;
  touch-action: manipulation;
}
.stage::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.06) 0%, rgba(99, 102, 241, 0.02) 42%, transparent 66%);
  pointer-events: none;
}
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.hub {
  position: absolute; left: 0; top: 0;
  width: 168px; height: 168px; border-radius: 50%;
  background: linear-gradient(150deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
  border: 2px solid rgba(255,255,255,.85);
  box-shadow: 0 6px 18px rgba(22,36,107,.15), 0 24px 50px rgba(99,102,241,.28);
  display: grid; place-items: center; gap: 1px;
  cursor: pointer; z-index: 6;
  will-change: transform;
  transition: box-shadow .2s;
}
.hub:hover { box-shadow: 0 8px 24px rgba(22,36,107,.25), 0 30px 70px rgba(99,102,241,.38); }
.hub-ico { color: #c7d2fe; margin-bottom: 1px; }
.hub-t { font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: #fff; text-align: center; padding: 0 12px; line-height: 1.15; }
.hub-s { font-size: 12px; font-weight: 600; color: #a5b4fc; }
.hub-ring {
  position: absolute; inset: -10px; border-radius: 50%;
  border: 1.5px solid #6366f1; opacity: 0; pointer-events: none;
}
.idle .hub-ring { animation: pulse 2.8s ease-out infinite; }
@keyframes pulse {
  0%   { transform: scale(.97); opacity: .55 }
  70%  { transform: scale(1.26); opacity: 0 }
  100% { transform: scale(1.26); opacity: 0 }
}

.node {
  position: absolute; left: 0; top: 0;
  width: 182px;
  background: linear-gradient(150deg, #4f46e5 0%, #6366f1 55%, #4338ca 100%);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 18px;
  padding: 15px 17px;
  box-shadow: 0 4px 12px rgba(99,102,241,.25), 0 12px 28px rgba(99,102,241,.2);
  cursor: pointer; z-index: 4;
  will-change: transform, opacity;
  transition: box-shadow .18s, filter .18s;
}
.node:hover { filter: brightness(1.08); box-shadow: 0 6px 16px rgba(99,102,241,.35), 0 18px 40px rgba(99,102,241,.3); }
.node-top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.node-ico {
  width: 34px; height: 34px; border-radius: 11px;
  background: rgba(255,255,255,.2);
  display: grid; place-items: center; flex-shrink: 0;
  color: #fff;
}
.node-dot {
  width: 9px; height: 9px; border-radius: 50%;
  margin-left: auto; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,.5);
}
.node-t { font-size: 16.5px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; color: #fff; }
.node-s { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.78); margin-top: 3px; }

.leaf {
  position: absolute; left: 0; top: 0;
  display: flex; align-items: center; gap: 11px;
  width: 250px;
  background: #ffffff;
  border: 1.5px solid #c7d2fe;
  border-radius: 30px;
  padding: 10px 16px 10px 10px;
  box-shadow: 0 2px 8px rgba(22,36,107,.08), 0 8px 20px rgba(99,102,241,.12);
  z-index: 5;
  will-change: transform, opacity;
  cursor: pointer;
  transition: border-color .18s, box-shadow .18s;
}
.leaf:hover { border-color: #6366f1; box-shadow: 0 4px 14px rgba(99,102,241,.22), 0 12px 28px rgba(99,102,241,.18); }
.leaf-ico {
  width: 36px; height: 36px; border-radius: 50%;
  background: #6366f1; color: #fff;
  display: grid; place-items: center; flex-shrink: 0;
}
.leaf-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
/*
 * Nom ikki qatorgacha o'raladi. Bir qatorda kesilganda KGF ning to'rtta
 * "kokandgoldfuture.uz ..." yozuvi bir xil ko'rinib qolar edi — qaysi biri
 * baza, qaysi biri pochta ekanini ajratib bo'lmasdi.
 */
.leaf-t {
  font-size: 15px; font-weight: 700; color: #1e1b4b; line-height: 1.22;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: break-word;
}
.leaf-k {
  font-size: 11.5px; font-weight: 500; color: #64748b;
  font-family: var(--mono); line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.leaf-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0 }

/* Telefonda orbita o'rniga ro'yxat. Aylana 375 px ga sig'maydi: markazning
   radiusi va kartaning yarmi qo'shilganda kartalar markazdan 129 px narida
   turishi kerak, ekran chetiga urilmaslik uchun esa 94 px dan uzoqqa chiqa
   olmaydi. Qancha kichraytirsa ham bu ikki shart bir vaqtda bajarilmaydi. */
.orb-l { display: flex; flex-direction: column; gap: 10px; margin-top: 18px }
.orb-g { width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
         border-radius: 16px; box-shadow: var(--sh); overflow: hidden }
.orb-b { width: 100%; display: flex; align-items: center; gap: 11px; padding: 13px 14px;
         background: none; border: 0; cursor: pointer; font: inherit; color: inherit;
         text-align: left }
.orb-ico { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
           color: #fff; flex-shrink: 0 }
.orb-txt { flex: 1; min-width: 0 }
.orb-n { display: block; font-size: 14px; font-weight: 800; letter-spacing: -.01em; color: var(--ink) }
.orb-s { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink-3); margin-top: 1px }
.orb-d { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0 }
.orb-ch { color: var(--ink-3); flex-shrink: 0; transition: transform .18s }
.orb-b[aria-expanded="true"] .orb-ch { transform: rotate(90deg) }
.orb-i { display: flex; align-items: center; gap: 10px; padding: 11px 14px 11px 16px;
         border-top: 1px solid var(--line); cursor: pointer }
.orb-i:last-child { border-radius: 0 0 16px 16px }
.orb-ii { width: 26px; height: 26px; border-radius: 9px; background: var(--blue-s); color: var(--blue);
          display: grid; place-items: center; flex-shrink: 0 }
.orb-it { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
          overflow-wrap: break-word }
.orb-ik { display: block; font-size: 10px; font-weight: 600; color: var(--ink-3);
          font-family: var(--mono); margin-top: 1px }

.legend {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 6px 16px;
  padding-block: 14px 6px;
  font-size: 11.5px; color: #475569; font-weight: 600;
}
.lg { display: flex; align-items: center; gap: 6px; }
.lg i { width: 8px; height: 8px; border-radius: 50%; display: block }
.lg-by {
  display: flex; align-items: center; gap: 6px;
  color: #64748b; font-weight: 600;
  border-left: 1px solid #cbd5e1; padding-left: 16px;
}
.hint {
  text-align: center; padding-bottom: 20px;
  font-size: 12px; color: #64748b; font-weight: 500;
}
.kbd {
  font-family: monospace; font-size: 10.5px; font-weight: 500;
  background: #ffffff; border: 1px solid #cbd5e1;
  padding: 2px 7px; border-radius: 5px; color: #334155;
}

@media (max-width: 900px) {
  .h-top { flex-wrap: wrap }
  .h-ong { order: -1; width: 100%; justify-content: space-between }
}

@media (max-width: 560px) {
  .stage { height: min(70vh, 600px); min-height: 440px }
  .hub { width: 124px; height: 124px }
  .hub-t { font-size: 13.5px } .hub-s { font-size: 10.5px }
  .node { width: 134px; padding: 11px 12px; border-radius: 14px }
  .node-t { font-size: 13.5px } .node-s { font-size: 11px }
  .node-ico { width: 27px; height: 27px; border-radius: 9px }
  .leaf { width: 156px; padding: 7px 11px 7px 7px; gap: 8px; border-radius: 24px }
  .leaf-t { font-size: 12.5px; white-space: normal; line-height: 1.2 }
  .leaf-k { display: none }
  .leaf-ico { width: 28px; height: 28px }
  .leaf-dot { width: 8px; height: 8px }
}

</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo">
      <span class="logo-m"><svg width="20" height="20" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M3 14L7 9L3 4H7L9 7L11 4H15L11 9L15 14H11L9 11L7 14H3Z" fill="white"/></svg></span>
      <span class="logo-t">DIMON<span>AGENCY</span></span>
    </div>
    <nav class="nav">
      <button type="button" class="on" id="nav-bosh">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>Agentlar</span></button>
      <button type="button" id="nav-orbit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/><circle cx="19" cy="8" r="1.5" fill="currentColor"/></svg>
        <span>Loyihalar</span></button>
      <button type="button" class="soon" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20"/></svg>
        <span>Obunalar</span></button>
      <button type="button" class="soon" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M4.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 0012 4.6a2 2 0 114 0 1.65 1.65 0 002.9 1.17l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0021.4 12"/></svg>
        <span>Sozlamalar</span></button>
    </nav>
    <div class="side-b"><div class="who"><span class="ava">D</span>
      <span><span class="who-n">Dilmurod</span><span class="who-r">Admin</span></span></div></div>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
let BINO = [], AVATAR = {}, SALOMAT = null;

/* Kim qayerda ishlaydi. Rita hamma loyihani ping qiladi; Debra KGF va
   CRM ni nazorat qiladi; Layla INFRA to'lovlarini oladi; Sara agentlar
   xatolarini kuzatadi. `yuz` — kartochkadagi katta surat. */
const ISH = {
  agentlar: { kim: ['Sara', 'Debra', 'Rita', 'Layla'], yuz: 'agentlar' },
  kgf:      { kim: ['Debra', 'Rita'],                  yuz: 'Debra'    },
  subtitr:  { kim: ['Sara', 'Rita'],                   yuz: 'Sara'     },
  tur:      { kim: ['Rita', 'Debra'],                  yuz: 'Rita'     },
  crm:      { kim: ['Debra', 'Rita'],                  yuz: 'Debra'    },
  infra:    { kim: ['Layla', 'Rita'],                  yuz: 'Layla'    },
};
const ish = (id) => ISH[id] ?? { kim: ['Rita'], yuz: 'Rita' };
const VAZIFA = {
  Debra: 'boshliq — kunlik hisobot',
  Rita:  'loyihalar nazorati',
  Layla: 'obunalar va to’lovlar',
  Sara:  'xatoliklar kuzatuvi',
};

const RANG = { agentlar:'#4f7cf7', kgf:'#1fb57a', subtitr:'#8b5cf6',
               tur:'#14b8c4', crm:'#f59e0b', infra:'#ec4899' };
const ICO = {
  agentlar:'<path d="M3 11a9 9 0 0118 0"/><rect x="2" y="11" width="5" height="8" rx="2"/><rect x="17" y="11" width="5" height="8" rx="2"/><path d="M21 19a3 3 0 01-3 3h-3"/>',
  kgf:'<path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>',
  subtitr:'<path d="M12 2.5l9.5 4.6L12 11.7 2.5 7.1 12 2.5z"/><path d="M2.5 16.9L12 21.5l9.5-4.6"/><path d="M2.5 12L12 16.6 21.5 12"/>',
  tur:'<circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8a16 16 0 010 18.4 16 16 0 010-18.4z"/>',
  crm:'<rect x="2" y="7" width="20" height="14" rx="3"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
  infra:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
};
const KIND = { http:'sayt', docker:'konteyner', systemd:'servis', agent:'agent' };
const SNOM = { ok:'ishlayapti', warn:'ogohlantirish', err:'ishlamayapti', ochiq:'o’chirilgan' };
const holatOf = (x) => x.items.some(i => i.status === 'err') ? 'err'
  : x.items.some(i => i.status === 'warn') ? 'warn' : 'ok';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const svg = (d, c = 'currentColor', n = 22) =>
  `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const sana = (ts) => ts
  ? new Date(ts).toLocaleString('uz-UZ',
    { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
  : '—';
const soat = (ts) => ts ? new Date(ts).toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' }) : '—';
const muddat = (ms) => {
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const m = Math.floor(ms / 60000);
  if (m < 60) return m + ' daqiqa';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' soat';
  return Math.floor(h / 24) + ' kun';
};
const rasmYoki = (nom, klass) => {
  const a = AVATAR[nom.toLowerCase()];
  return a ? `<img class="${klass}" src="${a}" alt="${esc(nom)}">`
           : `<span class="${klass}" style="background:var(--blue);color:#fff;display:grid;
                place-items:center;font-weight:800;font-size:1.6em">${esc(nom[0])}</span>`;
};
const loyihaTop = (kalit) => {
  for (const x of BINO) {
    const i = x.items.find((p) => p.kalit === kalit);
    if (i) return { xona: x, it: i };
  }
  return null;
};

/* ═════════ KO'RINISHLAR ═════════ */
const main = document.getElementById('main');
let kor = { turi: 'bosh' };
let qidiruv = '';

const ORQAGA = (ket, nom) =>
  `<button class="orqaga" data-ket="${ket}">${svg('<path d="M19 12H6M12 18l-6-6 6-6"/>', 'currentColor', 14)} ${esc(nom)}</button>`;

/* ── Bosh sahifa ── */
function boshKor() {
  const f = qidiruv.trim().toLowerCase();
  const kir = BINO.filter((x) => !f || x.nom.toLowerCase().includes(f) ||
    x.items.some((i) => i.nom.toLowerCase().includes(f)));
  const yomon = BINO.flatMap((x) => x.items).filter((i) => i.status === 'err').length;

  main.innerHTML = `
    <div class="top"><div>
      <div class="eyebrow">DIMON AGENCY</div>
      <h1>Agentlar Binosi</h1><div class="rule"></div>
      <p class="lead">${yomon
        ? `<b style="color:var(--err)">${yomon} ta loyihada muammo bor.</b> Qizil belgilarga qarang.`
        : 'Hammasi joyida — barcha loyihalar ishlab turibdi.'}</p></div>
      <div class="tools">
        <label class="search">
          ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.2-4.2"/>', 'var(--ink-3)', 15)}
          <input id="qidir" type="search" placeholder="Agent yoki bo‘lim qidirish…" value="${esc(qidiruv)}" aria-label="Qidirish">
        </label>
        <button class="icon-b" id="yangila-b" title="Yangilash" aria-label="Yangilash">
          ${svg('<path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/>', 'currentColor', 17)}
          ${yomon ? '<span class="nuqta"></span>' : ''}</button>
      </div></div>
    ${f ? '' : salomatKor()}
    ${kir.length ? `<div class="grid">${kir.map(karta).join('')}</div>`
                 : '<div class="bosh">Hech narsa topilmadi</div>'}`;
}

/* ── Profilaktika paneli ──
   Rita kunda bir marta yozadi: server resurslari, sertifikat va domen
   muddatlari, sekinlashuv. Hammasi joyida bo'lsa ham resurslar ko'rsatiladi —
   disk sekin to'lib borishini odam faqat raqamni ko'rib sezadi. */
function salomatKor() {
  if (!SALOMAT) return '';
  const RANGI = { ok: 'var(--ok)', warn: 'var(--warn)', err: 'var(--err)' };

  const olchov = (SALOMAT.server || []).map((x) => `
    <div class="sal-k">
      <div class="sal-t">
        <span class="sal-n">${esc(x.nom)}</span>
        <span class="sal-v" style="color:${RANGI[x.status]}">${x.foiz}%</span>
      </div>
      <div class="sal-b"><i style="width:${Math.min(100, Math.max(2, x.foiz))}%;
        background:${RANGI[x.status]}"></i></div>
      <div class="sal-m">${esc(x.matn)}</div>
    </div>`).join('');

  // Muddatlar va sekinlashuv: faqat e'tibor talab qilganlari chiqadi,
  // aks holda panel har kuni bir xil "hammasi yaxshi" ro'yxatiga aylanadi.
  const ogoh = [...(SALOMAT.ssl || []), ...(SALOMAT.domen || []), ...(SALOMAT.sekin || [])]
    .filter((x) => x.status !== 'ok')
    .map((x) => `<div class="sal-q"><i style="background:${RANGI[x.status]}"></i>
      <span><b>${esc(x.nom || x.host || x.domen || x.kalit)}</b> — ${esc(x.matn)}</span></div>`)
    .join('');

  if (!olchov && !ogoh) return '';
  return `<section class="sal">
    ${olchov ? `<div class="sal-r">${olchov}</div>` : ''}
    ${ogoh ? `<div class="sal-x">${ogoh}</div>` : ''}
    <div class="sal-vaqt">Tekshirildi: ${esc(sana(SALOMAT.at))}</div>
  </section>`;
}

function karta(x) {
  const rang = RANG[x.id] ?? '#6c4ef0';
  const { kim, yuz } = ish(x.id);
  const a = AVATAR[yuz.toLowerCase()];
  const isAgentlar = x.id === 'agentlar';

  return `<article class="c" tabindex="0" role="button" data-xona="${x.id}"
      aria-label="${esc(x.nom)}, ${x.items.length} ta">
    <span class="c-fon" style="background:linear-gradient(135deg,${rang}22,${rang}08 60%,transparent)"></span>
    ${a ? `<img class="c-rasm" src="${a}" alt="" aria-hidden="true">` : ''}
    <div class="c-top">
      <span class="c-ico" style="background:${rang}">${svg(ICO[x.id] ?? ICO.infra, '#fff')}</span>
      <span><span class="c-n">${esc(x.nom)}</span><span class="c-s">${esc(x.izoh)}</span></span>
      ${!isAgentlar ? `<span class="c-cnt">${svg('<circle cx="9" cy="8" r="3.4"/><path d="M15.5 20v-1.5a4 4 0 00-4-4h-5a4 4 0 00-4 4V20"/>', 'currentColor', 13)} ${x.items.length} ta</span>` : ''}
    </div>
    <div class="c-list">${x.items.slice(0, 6).map((i) =>
      `<div class="c-li"><i class="d-${i.status}"></i><span>${esc(i.nom)}</span></div>`).join('')}
      ${x.items.length > 6 ? `<div class="c-yana">+${x.items.length - 6} ta yana</div>` : ''}</div>
    <div class="c-bot">
      ${!isAgentlar ? `<span class="stack">${kim.map((n) => {
        const av = AVATAR[n.toLowerCase()];
        return av ? `<img src="${av}" alt="${n}" title="${n}" data-agent="${n}">`
                  : `<span class="plus" title="${n}" data-agent="${n}">${n[0]}</span>`;
      }).join('')}</span>` : ''}
      <button class="c-btn" type="button" data-xona="${x.id}">Barchasini ko‘rish
        ${svg('<path d="M5 12h13M13 6l6 6-6 6"/>', 'currentColor', 13)}</button>
    </div></article>`;
}

/* ── Bo'lim ── */
function xonaKor(id) {
  const x = BINO.find((r) => r.id === id);
  if (!x) return ketBosh();
  const rang = RANG[x.id] ?? '#6c4ef0';
  const { kim, yuz } = ish(x.id);
  const h = holatOf(x);

  main.innerHTML = ORQAGA('bosh', 'Agentlar Binosi') + `
    <div class="hero">
      <span class="hero-fon" style="background:linear-gradient(120deg,${rang}1c,transparent 65%)"></span>
      ${rasmYoki(yuz, 'hero-rasm')}
      <div class="hero-i">
        <div class="hero-n">${esc(x.nom)}</div>
        <div class="hero-s">${esc(x.izoh)} · ${x.items.length} ta loyiha</div>
        <div class="hero-row">
          <span class="pill b-${h}">${SNOM[h]}</span>
          <span class="pill" style="background:${rang}1c;color:${rang}">Mas’ul: ${esc(kim.join(', '))}</span>
        </div></div></div>
    ${x.id === 'agentlar'
      ? `<div class="grid">${x.items.map(agentKarta).join('')}</div>`
      : loyihaRoyxati(x, rang)}`;
}

/** Agent kartochkasi — bosh sahifadagidek katta surat bilan. */
function agentKarta(i) {
  const rang = { Debra:'#4f7cf7', Rita:'#15a34a', Layla:'#8b5cf6', Sara:'#ea8a07' }[i.nom] ?? '#6c4ef0';
  const a = AVATAR[i.nom.toLowerCase()];
  const bolim = BINO.filter((x) => x.id !== 'agentlar' && ish(x.id).kim.includes(i.nom));
  const jami = bolim.reduce((n, x) => n + x.items.length, 0);
  return `<article class="c" tabindex="0" role="button" data-agent="${esc(i.nom)}"
      aria-label="${esc(i.nom)} — ${esc(i.target)}">
    <span class="c-fon" style="background:linear-gradient(135deg,${rang}26,${rang}0a 60%,transparent)"></span>
    ${a ? `<img class="c-rasm" src="${a}" alt="" aria-hidden="true">` : ''}
    <div class="c-top">
      <span><span class="c-n" style="font-size:19px">${esc(i.nom)}</span>
        <span class="c-s">${esc(VAZIFA[i.nom] ?? 'AI agent')}</span></span>
    </div>
    <div class="c-list">
      <div class="c-li"><i class="d-${i.status}"></i><span>${SNOM[i.status] ?? i.status}</span></div>
      <div class="c-li" style="color:var(--ink-2)"><i style="background:${rang}"></i>
        <span>${esc(i.target)}</span></div>
      ${bolim.length ? `<div class="c-li" style="color:var(--ink-2)"><i style="background:${rang}66"></i>
        <span>${bolim.length} bo‘lim · ${jami} loyiha</span></div>` : ''}
      ${i.note ? `<div class="c-yana">${esc(i.note)}</div>` : ''}
    </div>
    <div class="c-bot">
      <button class="c-btn" type="button" data-agent="${esc(i.nom)}">Batafsil
        ${svg('<path d="M5 12h13M13 6l6 6-6 6"/>', 'currentColor', 13)}</button>
    </div></article>`;
}

/** Oddiy bo'limlar uchun loyiha ro'yxati. */
function loyihaRoyxati(x, rang) {
  return `
    <div class="panel">
      <div class="panel-h">${svg(ICO[x.id] ?? ICO.infra, rang, 17)} Loyihalar — birini bosing</div>
      ${x.items.map((i) => `
        <div class="r" ${i.kalit ? `data-loyiha="${esc(i.kalit)}" tabindex="0" role="button"` : ''}>
          <i class="d-${i.status}"></i>
          <span style="min-width:0"><span class="r-n">${esc(i.nom)}</span><br>
            <span class="r-t">${esc(i.target)}</span></span>
          <span class="r-m"><span class="pill b-${i.status}">${SNOM[i.status] ?? i.status}</span>
            <span class="r-ms">${(KIND[i.kind] ?? i.kind)}${i.http ? ' · ' + i.http : ''}${i.ms != null ? ' · ' + i.ms + 'ms' : ''}</span>
          </span></div>`).join('')}
    </div>`;
}


/* ── Loyiha: to'liq sahifa ── */
function loyihaKor(kalit) {
  const t = loyihaTop(kalit);
  if (!t) return ketBosh();
  const { xona, it } = t;
  const rang = RANG[xona.id] ?? '#6c4ef0';
  const tarix = it.tarix ?? [];
  const foiz = tarix.length
    ? Math.round((tarix.filter((c) => c.s !== 'err').length / tarix.length) * 100) : null;
  const RANG2 = { ok:'#16a34a', warn:'#ea8a07', err:'#e11d48', ochiq:'#aeb5cd' };

  main.innerHTML = ORQAGA('xona:' + xona.id, xona.nom) + `
    <div class="hero">
      <span class="hero-fon" style="background:linear-gradient(120deg,${rang}1c,transparent 65%)"></span>
      <span class="hero-rasm" style="background:${rang};display:grid;place-items:center">
        ${svg(ICO[xona.id] ?? ICO.infra, '#fff', 54)}</span>
      <div class="hero-i">
        <div class="hero-n">${esc(it.nom)}</div>
        <div class="hero-s">${KIND[it.kind] ?? it.kind} · ${esc(xona.nom)} bo‘limi</div>
        <div class="hero-row">
          <span class="pill b-${it.status}">${SNOM[it.status] ?? it.status}</span>
          ${it.havola
            ? `<a class="link" href="${esc(it.havola)}" target="_blank" rel="noopener">
                 ${svg('<path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/>', 'currentColor', 13)}
                 Saytni ochish</a>`
            : `<span class="pill b-ochiq" style="font-family:var(--mono);font-size:10.5px">${esc(it.target)}</span>`}
        </div></div></div>

    <div class="kolon">
      <div>
        <div class="panel">
          <div class="panel-h">${svg('<path d="M2.5 12h4l2.5-7 5 14 2.5-7h5"/>', rang, 17)} Qanday ketyapti</div>
          <div class="panel-b">
            <div class="stat-grid">
              <div class="stat"><div class="stat-k">Javob vaqti</div>
                <div class="stat-v">${it.ms ?? '—'}<small> ms</small></div></div>
              <div class="stat"><div class="stat-k">Javob kodi</div>
                <div class="stat-v">${it.http ?? '—'}</div></div>
              <div class="stat"><div class="stat-k">Tekshirildi</div>
                <div class="stat-v" style="font-size:17px">${soat(it.at)}</div></div>
              <div class="stat"><div class="stat-k">Ishonchlilik</div>
                <div class="stat-v">${foiz ?? '—'}<small>%</small></div></div>
            </div>
            ${tarix.length ? `<div style="margin-top:18px">
              <div class="stat-k">Oxirgi ${tarix.length} ta tekshiruv</div>
              <div class="bar">${tarix.map((c) => {
                const b = c.s === 'err' ? 38 : Math.max(14, Math.min(42, (c.ms ?? 200) / 24));
                return `<i style="height:${b}px;background:${RANG2[c.s] ?? '#ccc'}"

          <div class="panel-b">${ish(xona.id).kim.map((n) =>
            `<div class="mini" data-agent="${n}" tabindex="0" role="button">

let orbitAnimId = null;

const ORBIT_ICO = {

};
const svgOrbitIco = (k, size = 15, sw = 1.8) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ORBIT_ICO[k] || ORBIT_ICO.grid}</svg>`;

/* Orbita qaysi kenglikdan boshlab sig'maydi. Hisob: markazning radiusi
   (62) va kartaning yarmi (67) qo'shilib, karta markazdan kamida 129 px
   narida turishi kerak; shu bilan birga ekran chetiga urilmasligi kerak.
   560 px dan tor ekranda bu ikkisi birga bajarilmaydi. */
const TOR = () => window.innerWidth <= 560;

/* Guruhning ichidagi loyihalar — ro'yxat ko'rinishi uchun. */
function orbitQator(g) {
  return g.items.map((it) => {
    const r = it.raw || {};
    const belgi = r.kalit ? `data-loyiha="${esc(r.kalit)}"`
      : r.kind === 'agent' ? `data-agent="${esc(r.nom)}"`
      : `data-xona="${esc(g.id)}"`;
    return `<div class="orb-i" ${belgi} role="button" tabindex="0">
      <span class="orb-ii">${svgOrbitIco(it.ik, 14)}</span>
      <span class="orb-it">${esc(it.t)}<span class="orb-ik">${esc(it.k)}</span></span>
      <span class="orb-d d-${it.s}"></span>
    </div>`;
  }).join('');
}

/*
 * Telefon ko'rinishi: aylana o'rniga yig'iladigan ro'yxat. Bosilganda
 * guruh ochiladi, loyihaga bosilsa — o'sha loyiha sahifasi (bosish
 * `main` dagi umumiy ishlov beruvchiga tushadi, data-loyiha orqali).
 */
function orbitRoyxatKor(GURUHLAR) {
  main.innerHTML = `
    <div class="h-top">
      <div>
        <div class="crumb">DIMON AGENCY</div>
        <h1 class="h-tit">Loyihalar</h1>
        <p class="h-sub">Bo'limga bosing — ichidagi loyihalar ochiladi</p>
      </div>
    </div>
    <div class="orb-l">
      ${GURUHLAR.map((g) => `
        <section class="orb-g">
          <button class="orb-b" type="button" aria-expanded="false" data-guruh="${esc(g.id)}">
            <span class="orb-ico" style="background:${RANG[g.id] ?? '#6c4ef0'}">${svgOrbitIco(g.icon, 17)}</span>
            <span class="orb-txt"><span class="orb-n">${esc(g.name)}</span>
              <span class="orb-s">${esc(g.sub)}</span></span>
            <span class="orb-d d-${g.status}"></span>
            <span class="orb-ch">${svgOrbitIco('chev', 15)}</span>
          </button>
          <div class="orb-items" hidden>${orbitQator(g)}</div>
        </section>`).join('')}
    </div>
    <div class="legend">
      <span class="lg"><i style="background:var(--ok)"></i>Ishlayapti</span>
      <span class="lg"><i style="background:var(--warn)"></i>Sekin / ogohlantirish</span>
      <span class="lg"><i style="background:var(--err)"></i>Ishlamayapti</span>
    </div>`;

  for (const b of main.querySelectorAll('.orb-b')) {
    b.addEventListener('click', () => {
      const ochiq = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', String(!ochiq));
      b.nextElementSibling.hidden = ochiq;
    });
  }
}

/* Ekran kengligi chegaradan o'tib ketsa ko'rinishni qayta quramiz —
   telefonni yon tomonga burganda ham to'g'ri ko'rinsin. */
let orbitTor = null;
addEventListener('resize', () => {
  if (kor.turi !== 'orbit') return;
  if (orbitTor === TOR()) return;
  chiz();
});

function orbitKor() {
  if (orbitAnimId) { cancelAnimationFrame(orbitAnimId); orbitAnimId = null; }
  orbitTor = TOR();

  const GROUPS = (BINO && BINO.length ? BINO : []).map((x) => ({
    id: x.id,
    name: x.nom,
    sub: `${x.items.length} ta loyiha`,
    icon: x.id === 'agentlar' ? 'cpu' : x.id === 'kgf' ? 'zap' : x.id === 'crm' ? 'users' : x.id === 'subtitr' ? 'caps' : x.id === 'tur' ? 'send' : 'panel',
    status: holatOf(x),
    items: x.items.map((it) => ({
      t: it.nom,
      k: it.kind || it.target || '',
      ik: it.kind === 'http' ? 'globe' : it.kind === 'docker' ? 'bot' : it.kind === 'agent' ? 'crown' : 'panel',
      s: it.status || 'ok',
      raw: it
    }))
  }));

  // Tor ekranda aylana o'rniga ro'yxat — sabab TOR() yonida yozilgan
  if (orbitTor) return orbitRoyxatKor(GROUPS);

  main.innerHTML = `
    <div class="h-top">
      <div>
        <div class="crumb">DIMON AGENCY</div>
        <h1 class="h-tit">Loyihalar Orbitasi</h1>
        <p class="h-sub">Markazdan sochilib sekin aylanadigan jonli orbital xarita</p>
      </div>
      <div class="h-ong">
        <div class="crumb" id="crumb" style="font-weight:700">Loyihalar</div>
        <button class="icon-b" id="btn-pause" title="To'xtatish" aria-label="Aylanishni to'xtatish">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>
    </div>
    <div class="stage idle" id="stage">
      <svg class="wires" id="wires" aria-hidden="true"></svg>
      <div class="hub" id="hub" role="button" tabindex="0" aria-label="Loyihalarni ochish">
        <span class="hub-ring"></span>
        <span class="hub-ico" id="hub-ico"></span>
        <span class="hub-t" id="hub-t">Loyihalar</span>
        <span class="hub-s" id="hub-s">bosing</span>
      </div>
    </div>
    <div class="legend">
      <span class="lg"><i style="background:var(--ok)"></i>Ishlayapti</span>
      <span class="lg"><i style="background:var(--warn)"></i>Sekin / ogohlantirish</span>
      <span class="lg"><i style="background:var(--err)"></i>Ishlamayapti</span>
      <span class="lg-by">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        Debra kuzatadi
      </span>
    </div>
    <div class="hint"><span class="kbd">Esc</span> <span id="hint-t">markazni bosing — loyihalar orbitaga chiqadi</span></div>
  `;

  const stage = document.getElementById('stage');
  const wires = document.getElementById('wires');
  const hub   = document.getElementById('hub');
  const hubT  = document.getElementById('hub-t');
  const hubS  = document.getElementById('hub-s');
  const hubI  = document.getElementById('hub-ico');
  const crumb = document.getElementById('crumb');
  const hintT = document.getElementById('hint-t');
  const btnPause = document.getElementById('btn-pause');

  const NS = 'http://www.w3.org/2000/svg';
  const sv = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

  // Doira emas, ellips: sahna keng, shuning uchun gorizontal bo'yicha
  // ko'proq joy bor — kartalar kattaroq va bir-biriga tiqilmaydi.
  const ring = sv('ellipse', { cx:0, cy:0, rx:0, ry:0, fill:'none', stroke:'#6366f1',
    'stroke-width':1.2, 'stroke-dasharray':'3 8', opacity:0 });
  const ring2 = sv('ellipse', { cx:0, cy:0, rx:0, ry:0, fill:'none', stroke:'#6366f1',
    'stroke-width':1.2, 'stroke-dasharray':'2 7', opacity:0 });
  wires.append(ring, ring2);

  let hoverCount = 0;

  const nodes = GROUPS.map((g, i) => {
    const el = document.createElement('div');
    el.className = 'node';
    el.setAttribute('role', 'button');
    el.tabIndex = -1;
    el.setAttribute('aria-label', `${g.name} — ${g.sub}`);
    el.innerHTML =
      `<div class="node-top">
         <span class="node-ico">${svgOrbitIco(g.icon, 19)}</span>
         <span class="node-dot d-${g.status}"></span>
       </div>
       <div class="node-t">${esc(g.name)}</div>
       <div class="node-s">${esc(g.sub)}</div>`;
    stage.appendChild(el);

    const line = sv('line', { stroke:'#6366f1', 'stroke-width':1.4, opacity:0, 'stroke-linecap':'round' });
    wires.insertBefore(line, wires.firstChild);

    el.addEventListener('click', (e) => { e.stopPropagation(); focusGroup(i); });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); focusGroup(i); }
    });
    el.addEventListener('pointerenter', () => hoverCount++);
    el.addEventListener('pointerleave', () => hoverCount--);

    return { g, el, line, a0: (i / Math.max(1, GROUPS.length)) * Math.PI * 2 - Math.PI / 2, r: 0, sc: 0, op: 0 };
  });

  const leaves = [];
  GROUPS.forEach((g, gi) => g.items.forEach((it, j) => {
    const el = document.createElement('div');
    el.className = 'leaf';
    el.setAttribute('role', 'button');
    el.tabIndex = -1;
    el.innerHTML =
      `<span class="leaf-ico">${svgOrbitIco(it.ik, 17, 2)}</span>
       <span class="leaf-txt">
         <span class="leaf-t">${esc(it.t)}</span>
         <span class="leaf-k">${esc(it.k)}</span>
       </span>
       <span class="leaf-dot d-${it.s}"></span>`;
    stage.appendChild(el);

    const line = sv('line', { stroke:'#6366f1', 'stroke-width':1.2, opacity:0,
      'stroke-dasharray':'3 5', 'stroke-linecap':'round' });
    wires.insertBefore(line, wires.firstChild);

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (it.raw && it.raw.kalit) ket({ turi: 'loyiha', id: it.raw.kalit });
      else if (it.raw && it.raw.kind === 'agent') ket({ turi: 'agent', id: it.raw.nom.toLowerCase() });
      else ket({ turi: 'xona', id: g.id });
    });
    el.addEventListener('pointerenter', () => hoverCount++);
    el.addEventListener('pointerleave', () => hoverCount--);

    leaves.push({ gi, idx: j, el, line,
      a0: (j / Math.max(1, g.items.length)) * Math.PI * 2 - Math.PI / 2, r: 0, sc: 0, op: 0 });
  }));

  let mode = 'idle';
  let sel  = -1;
  let T = 0, paused = false;
  let W = 0, H = 0, cx = 0, cy = 0, RX = 0, RY = 0;
  let mW = -1, mH = -1;

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const W_OUT = 0.085;
  const W_IN  = 0.105;
  const HUB_F = 0.7;

  /**
   * Ichki halqa guruhdagi loyiha soniga qarab torayadi: 2 ta loyiha butun
   * sahnaga yoyilib ketmasin, 9 tasi esa bir-birining ustiga chiqmasin.
   */
  function focusFactor() {
    const n = sel < 0 ? 6 : GROUPS[sel].items.length;
    return n <= 2 ? 0.52 : n <= 4 ? 0.74 : n <= 6 ? 0.88 : 1;
  }

  function measure() {
    const b = stage.getBoundingClientRect();
    W = b.width; H = b.height; cx = W / 2; cy = H / 2;
    mW = stage.clientWidth; mH = stage.clientHeight;

    // Eng katta kartaning yarmi — hech biri sahna chetidan chiqib ketmasin
    let yarimW = 90, yarimH = 40;
    for (const el of [...nodes, ...leaves].map((o) => o.el)) {
      yarimW = Math.max(yarimW, el.offsetWidth / 2);
      yarimH = Math.max(yarimH, el.offsetHeight / 2);
    }
    const chet = W < 560 ? 10 : 18;
    RX = Math.max(130, W / 2 - yarimW - chet);
    RY = Math.max(104, H / 2 - yarimH - chet);

    wires.setAttribute('width', W);
    wires.setAttribute('height', H);
    wires.setAttribute('viewBox', `0 0 ${W} ${H}`);
    for (const c of [ring, ring2]) { c.setAttribute('cx', cx); c.setAttribute('cy', cy); }
  }

  const resizeObs = new ResizeObserver(measure);
  resizeObs.observe(stage);
  measure();

  function setMode(m, i) {
    mode = m; sel = (i === undefined ? -1 : i);
    stage.classList.toggle('idle', m === 'idle');
    nodes.forEach((n) => { n.el.tabIndex = m === 'orbit' ? 0 : -1; });
    leaves.forEach((lf) => { lf.el.tabIndex = m === 'focus' && lf.gi === sel ? 0 : -1; });

    if (m === 'focus') {
      const g = GROUPS[sel];
      hubI.innerHTML = svgOrbitIco(g.icon, 26);
      hubT.textContent = g.name;
      hubS.textContent = '← orqaga';
      crumb.innerHTML = `Loyihalar <span style="color:var(--ink-3)">/</span> <b>${esc(g.name)}</b>`;
      hintT.textContent = `${g.items.length} ta loyiha — markazni bosing, orqaga qaytasiz`;
    } else {
      hubI.innerHTML = svgOrbitIco('grid', 26);
      hubT.textContent = 'Loyihalar';
      hubS.textContent = m === 'orbit' ? GROUPS.length + ' guruh' : 'bosing';
      crumb.textContent = 'Loyihalar';
      hintT.textContent = m === 'orbit'
        ? "guruhni bosing — faqat uning loyihalari ko'rinadi"
        : 'markazni bosing — loyihalar orbitaga chiqadi';
    }
  }
  const focusGroup = (i) => setMode(mode === 'focus' && sel === i ? 'orbit' : 'focus', i);

  hub.addEventListener('click', () => setMode(mode === 'idle' ? 'orbit' : mode === 'focus' ? 'orbit' : 'idle'));
  hub.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); hub.click(); }
  });
  stage.addEventListener('click', (e) => { if (e.target === stage) setMode(mode === 'focus' ? 'orbit' : 'idle'); });

  btnPause.addEventListener('click', () => {
    paused = !paused;
    btnPause.innerHTML = paused
      ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5l12 7.5-12 7.5z"/></svg>'
      : '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    btnPause.title = paused ? 'Davom ettirish' : "To'xtatish";
  });

  const ease = (cur, target, dt, sp) => cur + (target - cur) * (1 - Math.exp(-sp * dt));
  let last = performance.now(), hubSc = 1, ringR = 0, ring2R = 0, ringO = 0, ring2O = 0;

  function frame(now) {
    if (kor.turi !== 'orbit') return;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (stage.clientWidth !== mW || stage.clientHeight !== mH) measure();
    if (!paused && !hoverCount && !reduce) T += dt;

    const k = 7;
    const inFocus = mode === 'focus';
    const inOrbit = mode === 'orbit';

    const ff = focusFactor();

    ringR = ease(ringR, inOrbit ? 1 : 0.42, dt, k);
    ringO = ease(ringO, inOrbit ? 0.3 : 0, dt, k);
    ring.setAttribute('rx', (RX * ringR).toFixed(1));
    ring.setAttribute('ry', (RY * ringR).toFixed(1));
    ring.setAttribute('opacity', ringO.toFixed(3));

    ring2R = ease(ring2R, inFocus ? ff : ff * 0.35, dt, k);
    ring2O = ease(ring2O, inFocus ? 0.32 : 0, dt, k);
    ring2.setAttribute('rx', (RX * ring2R).toFixed(1));
    ring2.setAttribute('ry', (RY * ring2R).toFixed(1));
    ring2.setAttribute('opacity', ring2O.toFixed(3));

    hubSc = ease(hubSc, inFocus ? HUB_F : 1, dt, k);
    hub.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%) scale(${hubSc.toFixed(3)})`;

    const aOut = T * W_OUT;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      const show = inOrbit;
      // Endi bu piksel emas, radius ulushi (0..1.18) — ellips uchun
      const tr  = mode === 'idle' ? 0 : inFocus ? (i === sel ? 0 : 1.18) : 1;
      const tsc = mode === 'idle' ? 0.3 : show ? 1 : 0.4;
      const top = show ? 1 : 0;

      n.r  = ease(n.r,  tr,  dt, k);
      n.sc = ease(n.sc, tsc, dt, k);
      n.op = ease(n.op, top, dt, k);

      const a = n.a0 + aOut;
      const x = cx + Math.cos(a) * RX * n.r;
      const y = cy + Math.sin(a) * RY * n.r;

      n.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%) scale(${n.sc.toFixed(3)})`;
      n.el.style.opacity = n.op.toFixed(3);
      n.el.style.pointerEvents = n.op > 0.55 ? 'auto' : 'none';

      const lo = n.op * 0.42;
      n.line.setAttribute('opacity', lo.toFixed(3));
      if (lo > 0.01) {
        n.line.setAttribute('x1', cx); n.line.setAttribute('y1', cy);
        n.line.setAttribute('x2', x.toFixed(1)); n.line.setAttribute('y2', y.toFixed(1));
      }
    }

    const aIn = T * W_IN;
    for (const lf of leaves) {
      const show = inFocus && lf.gi === sel;
      lf.r  = ease(lf.r,  show ? ff : ff * 0.3, dt, k);
      lf.sc = ease(lf.sc, show ? 1 : 0.45, dt, k);
      lf.op = ease(lf.op, show ? 1 : 0, dt, k);

      // Loyiha ko'p bo'lsa bittasi ichkarida, bittasi tashqarida — zinapoya
      // shaklida. Bo'lmasa yonma-yon turgan kartalar ustma-ust tushadi.
      const zig = GROUPS[lf.gi].items.length > 6 && lf.idx % 2 ? 0.68 : 1;
      const a = lf.a0 + aIn;
      const x = cx + Math.cos(a) * RX * lf.r * zig;
      const y = cy + Math.sin(a) * RY * lf.r * zig;

      lf.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%) scale(${lf.sc.toFixed(3)})`;
      lf.el.style.opacity = lf.op.toFixed(3);
      lf.el.style.pointerEvents = lf.op > 0.55 ? 'auto' : 'none';

      const lo = lf.op * 0.4;
      lf.line.setAttribute('opacity', lo.toFixed(3));
      if (lo > 0.01) {
        lf.line.setAttribute('x1', cx); lf.line.setAttribute('y1', cy);
        lf.line.setAttribute('x2', x.toFixed(1)); lf.line.setAttribute('y2', y.toFixed(1));
      }
    }

    orbitAnimId = requestAnimationFrame(frame);
  }

  setMode('idle');
  orbitAnimId = requestAnimationFrame(frame);
}

function chiz() {
  const nb = document.getElementById('nav-bosh');
  const no = document.getElementById('nav-orbit');
  if (nb) nb.classList.toggle('on', kor.turi === 'bosh');
  if (no) no.classList.toggle('on', kor.turi === 'orbit');

  if (orbitAnimId) { cancelAnimationFrame(orbitAnimId); orbitAnimId = null; }

  if (kor.turi === 'orbit') orbitKor();
  else if (kor.turi === 'xona') xonaKor(kor.id);
  else if (kor.turi === 'loyiha') loyihaKor(kor.id);
  else if (kor.turi === 'agent') agentKor(kor.id);
  else boshKor();
}
const ketBosh = () => { kor = { turi:'bosh' }; chiz(); };
const ket = (k) => { kor = k; chiz(); scrollTo({ top: 0, behavior: 'smooth' }); };

main.addEventListener('click', (e) => {
  if (e.target.closest('#yangila-b')) return yangila();
  if (e.target.closest('a')) return;
  const b = e.target.closest('[data-ket]');
  if (b) { const [t, id] = b.dataset.ket.split(':'); return ket(t === 'bosh' ? { turi:'bosh' } : { turi:t, id }); }
  const ag = e.target.closest('[data-agent]');
  if (ag) { e.stopPropagation(); return ket({ turi:'agent', id: ag.dataset.agent }); }
  const lo = e.target.closest('[data-loyiha]');
  if (lo) return ket({ turi:'loyiha', id: lo.dataset.loyiha });
  const xo = e.target.closest('[data-xona]');
  if (xo) return ket({ turi:'xona', id: xo.dataset.xona });
});
main.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const k = e.target.closest('[data-agent],[data-loyiha],[data-xona],[data-ket]');
  if (k) { e.preventDefault(); k.click(); }
});
main.addEventListener('input', (e) => {
  if (e.target.id !== 'qidir') return;
  qidiruv = e.target.value;
  boshKor();
  const q = document.getElementById('qidir');
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
});
document.getElementById('nav-bosh').addEventListener('click', ketBosh);
const noBtn = document.getElementById('nav-orbit');
if (noBtn) noBtn.addEventListener('click', () => ket({ turi: 'orbit' }));
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && kor.turi !== 'bosh') ketBosh();
});

/* ═════════ JONLI MA'LUMOT ═════════ */
async function yangila() {
  try {
    const r = await fetch('/api/holat', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    BINO = d.xonalar;
    SALOMAT = d.salomat || null;
    AVATAR = d.avatarlar ?? {};
  } catch (e) {
    main.innerHTML = `<div class="bosh">Ma’lumot olinmadi — ${esc(e.message)}</div>`;
    return;
  }
  chiz();
}
yangila();
setInterval(yangila, 60_000);
</script>
