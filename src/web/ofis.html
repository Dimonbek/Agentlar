<title>DIMON Agency ofisi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
:root {
  --out:    #dde5f6;
  --floor:  #faf8f4;
  --floor2: #f2eee6;
  --wall:   #2a3663;
  --wall-l: #46568f;
  --ink:    #16204a;
  --ink-2:  #44507c;
  --ink-3:  #818cb0;
  --card:   #ffffff;
  --line:   #e2e7f4;
  --blue:   #2b52ee;
  --blue-s: #e8edfe;
  --blue-b: #c7d4fb;
  --ok:   #15a34a; --ok-s:   #dcfce7;
  --warn: #d97706; --warn-s: #fef3c7;
  --err:  #dc2626; --err-s:  #fee2e2;
  --f:    'Plus Jakarta Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --sh:   0 2px 10px rgba(22,36,107,.1), 0 14px 38px rgba(42,54,99,.14);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
body {
  background: var(--out); color: var(--ink); font-family: var(--f); font-size: 14px;
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; overflow-x: hidden;
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
       padding-block: 14px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; letter-spacing: -.03em }
.mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
        background: linear-gradient(145deg, var(--blue), #1a3fdb); box-shadow: 0 2px 10px rgba(43,82,238,.35) }
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3) }
.crumbs button { font: inherit; color: var(--blue); background: none; border: none; cursor: pointer; padding: 0 }
.crumbs button:hover { text-decoration: underline }
.crumbs b { color: var(--ink) }

.stage { position: relative; width: 100% }
svg.plan { display: block; width: 100%; height: auto; touch-action: manipulation;
           border-radius: 16px; box-shadow: var(--sh) }

.room { cursor: pointer }
.room .glass { fill: transparent; transition: fill .2s }
.room:hover .glass { fill: rgba(43,82,238,.07) }
.room:focus-visible .glass { fill: rgba(43,82,238,.12) }
.plate { fill: var(--card); stroke: var(--line); stroke-width: 1 }
.tag  { font: 800 14px var(--f); fill: var(--ink); letter-spacing: .01em }
.sub  { font: 500 10.5px var(--f); fill: var(--ink-3) }
.cnt  { font: 700 10px var(--mono); fill: var(--blue) }
.capn { font: 700 9.5px var(--mono); fill: var(--wall-l); letter-spacing: .14em }

.door    { fill: var(--card); stroke: var(--line); stroke-width: 1.4; transition: fill .15s, stroke .15s }
.door-g  { cursor: pointer }
.door-g:hover .door, .door-g:focus-visible .door { fill: var(--blue-s); stroke: var(--blue) }
.door-t  { font: 600 10.5px var(--f); fill: var(--ink-2); pointer-events: none }
.door-k  { font: 500 8.5px var(--mono); fill: var(--ink-3); pointer-events: none }
.dot-ochiq { fill: #9aa6c6 }
.dot-ok { fill: var(--ok) } .dot-warn { fill: var(--warn) } .dot-err { fill: var(--err) }

.agent-g { cursor: pointer }
.agent-g .halqa { transition: stroke-width .15s }
.agent-g:hover .halqa, .agent-g:focus-visible .halqa { stroke-width: 3.4 }
.agent-n { font: 700 9.5px var(--f); fill: var(--ink-2); pointer-events: none }
.agent-r { font: 500 8.5px var(--f); fill: var(--ink-3); pointer-events: none }

.tip { position: absolute; pointer-events: none; opacity: 0; transform: translateY(5px);
       transition: opacity .13s, transform .13s; z-index: 20;
       background: var(--card); border: 1px solid var(--blue-b); border-radius: 12px;
       box-shadow: var(--sh); padding: 11px 13px; min-width: 200px; max-width: 270px }
.tip.show { opacity: 1; transform: translateY(0) }
.tip-h { display: flex; align-items: center; gap: 8px; margin-bottom: 7px }
.tip-n { font-weight: 700; font-size: 12.5px; line-height: 1.2 }
.tip-b { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;
         padding: 2px 8px; border-radius: 20px; margin-left: auto; white-space: nowrap }
.b-ok { background: var(--ok-s); color: var(--ok) } .b-warn { background: var(--warn-s); color: var(--warn) }
.b-err { background: var(--err-s); color: var(--err) }
.b-ochiq { background: #eef1f7; color: #68748f }
.tip-r { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; margin-top: 3px }
.tip-k { color: var(--ink-3); font-weight: 600; flex-shrink: 0 }
.tip-v { font-family: var(--mono); font-size: 10.5px; color: var(--ink-2); text-align: right; overflow-wrap: anywhere }
.tip-note { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line);
            font-size: 11px; font-weight: 600; color: var(--err) }

.karta-fon { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  padding: 20px; background: rgba(22,36,107,.42); backdrop-filter: blur(5px);
  opacity: 0; pointer-events: none; transition: opacity .18s }
.karta-fon.show { opacity: 1; pointer-events: auto }
.karta { position: relative; background: var(--card); border-radius: 22px; box-shadow: var(--sh);
  padding: 26px 28px 22px; width: min(340px, 100%); text-align: center;
  transform: scale(.94); transition: transform .18s }
.karta-fon.show .karta { transform: scale(1) }
.karta-x { position: absolute; top: 14px; right: 16px; width: 30px; height: 30px; border: none;
  border-radius: 50%; background: var(--line); color: var(--ink-2); font: 700 15px var(--f);
  cursor: pointer; line-height: 1 }
.karta-x:hover { background: var(--blue-s); color: var(--blue) }
/* Surat 1:1 qirqiladi; yuz odatda yuqorida bo'lgani uchun kadr tepaga suriladi */
.karta-rasm { width: 132px; height: 132px; border-radius: 50%; margin: 0 auto 14px;
  display: block; object-fit: cover; object-position: center 22%;
  border: 4px solid var(--card); box-shadow: var(--sh) }
.karta-n { font-size: 21px; font-weight: 800; letter-spacing: -.02em }
.karta-r { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin-top: 2px }
.karta-b { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
  padding: 4px 12px; border-radius: 20px; margin-top: 12px }
.karta-v { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--ink-2); line-height: 1.5 }
.karta-v b { color: var(--ink) }

.legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px 16px;
          padding-block: 14px 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-2) }
.lg { display: flex; align-items: center; gap: 6px }
.lg i { width: 8px; height: 8px; border-radius: 50%; display: block }
.hint { text-align: center; padding-bottom: 18px; font-size: 12px; color: var(--ink-3) }
.kbd { font-family: var(--mono); font-size: 10.5px; background: var(--card);
       border: 1px solid var(--line); padding: 2px 7px; border-radius: 5px; color: var(--ink-2) }

@media (max-width: 560px) {
  .tag { font-size: 12px } .sub { font-size: 9px } .door-t { font-size: 9px } .door-k { display: none }
  .tip { min-width: 165px; max-width: 215px }
}
</style>

<header class="bar">
  <div class="brand">
    <span class="mark">
      <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M3 14L7 9L3 4H7L9 7L11 4H15L11 9L15 14H11L9 11L7 14H3Z" fill="white"/>
      </svg>
    </span>
    DIMON Agency
  </div>
  <div class="crumbs">
    <span id="vaqt" style="font-weight:500">yuklanmoqda…</span>
    <span style="color:var(--line)">|</span>
    <span id="crumbs"></span>
  </div>
</header>

<div class="stage" id="stage">
  <svg class="plan" id="plan" viewBox="0 0 1000 640" aria-label="Ofis rejasi"></svg>
  <div class="tip" id="tip"></div>
</div>

<div class="karta-fon" id="karta-fon" role="dialog" aria-modal="true"><div class="karta" id="karta"></div></div>

<div class="legend">
  <span class="lg"><i style="background:var(--ok)"></i>Ishlayapti</span>
  <span class="lg"><i style="background:var(--warn)"></i>Ogohlantirish</span>
  <span class="lg"><i style="background:var(--err)"></i>Ishlamayapti</span>
</div>
<div class="hint"><span class="kbd">Esc</span> <span id="hint"></span></div>

<script>
let BINO = [];   // /api/holat dan to'ldiriladi

/* Agentlar — surat bo'lsa surat, bo'lmasa chizma ishlatiladi. */
const QIZLAR = [
  { nom:'Debra', kiyim:'#2b52ee', soch:'#6b4226', teri:'#f3d2b3', soch_turi:'uzun',   rasm:null },
  { nom:'Rita',  kiyim:'#15a34a', soch:'#ddb469', teri:'#f7dcc0', soch_turi:'tolqin', rasm:null },
  { nom:'Layla', kiyim:'#7c3aed', soch:'#171320', teri:'#eec9a6', soch_turi:'tekis',  rasm:null },
  { nom:'Sara',  kiyim:'#d97706', soch:'#2b1d14', teri:'#f0cfae', soch_turi:'dum',    rasm:null },
];

/**
 * Qaysi agent qaysi bo'limda ishlaydi.
 * Rita hamma loyihani ping qiladi, shuning uchun har xonada ko'rinadi.
 * Layla va Sara hali qurilmagan — faqat o'z xonalarida turadi.
 */
const ISH = {
  agentlar: ['Debra', 'Rita', 'Layla', 'Sara'],
  _boshqa:  ['Rita'],
};
const xonaAgentlari = (id) =>
  (ISH[id] ?? ISH._boshqa).map((n) => QIZLAR.find((q) => q.nom === n)).filter(Boolean);

/* ═════════ YORDAMCHILAR ═════════ */
const NS = 'http://www.w3.org/2000/svg';
const el = (n, a = {}, t) => {
  const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]);
  if (t != null) e.textContent = t;
  return e;
};
const plan = document.getElementById('plan');
const tip = document.getElementById('tip');
const stage = document.getElementById('stage');
const crumbs = document.getElementById('crumbs');
const hint = document.getElementById('hint');
const W = 1000, H = 640;
const KIND = { http:'sayt', docker:'konteyner', systemd:'servis', agent:'agent' };
const SNOM = { ok:'ishlayapti', warn:'ogohlantirish', err:'ishlamayapti', ochiq:'o’chirilgan' };
const holatOf = (x) => x.items.some(i => i.status === 'err') ? 'err'
  : x.items.some(i => i.status === 'warn') ? 'warn' : 'ok';

/* ═════════ UMUMIY CHIZMA ═════════ */
function asos(sarlavha) {
  plan.replaceChildren();
  const defs = el('defs');
  const f = el('filter', { id:'soya', x:'-30%', y:'-30%', width:'160%', height:'190%' });
  f.append(el('feDropShadow', { dx:0, dy:3, stdDeviation:4, 'flood-color':'#1b2547', 'flood-opacity':'.16' }));
  defs.append(f);
  const p = el('pattern', { id:'parket', width:34, height:34, patternUnits:'userSpaceOnUse' });
  p.append(el('rect', { width:34, height:34, fill:'var(--floor)' }));
  p.append(el('path', { d:'M0 0H34M0 17H34', stroke:'var(--floor2)', 'stroke-width':1 }));
  p.append(el('path', { d:'M0 0V17M17 17V34', stroke:'var(--floor2)', 'stroke-width':1 }));
  defs.append(p);
  plan.append(defs);
  plan.append(el('rect', { x:0, y:0, width:W, height:H, fill:'var(--out)' }));
  plan.append(el('rect', { x:26, y:26, width:W-52, height:H-52, rx:14, fill:'var(--wall)', filter:'url(#soya)' }));
  plan.append(el('rect', { x:40, y:40, width:W-80, height:H-80, rx:8, fill:'url(#parket)' }));
  plan.append(el('text', { x:46, y:19, class:'capn' }, sarlavha));
}

function xonaRamka(j, rang) {
  const g = el('g');
  g.append(el('rect', { x:j.x, y:j.y, width:j.w, height:j.h, rx:9, fill:'var(--wall)', filter:'url(#soya)' }));
  g.append(el('rect', { x:j.x+7, y:j.y+7, width:j.w-14, height:j.h-14, rx:5, fill:'var(--card)' }));
  g.append(el('rect', { x:j.x+7, y:j.y+7, width:j.w-14, height:4, rx:2, fill:rang, opacity:.85 }));
  return g;
}
function gul(x, y) {
  const g = el('g');
  g.append(el('path', { d:`M${x-5} ${y} L${x+5} ${y} L${x+3.5} ${y+9} L${x-3.5} ${y+9} Z`, fill:'#c08457' }));
  g.append(el('circle', { cx:x, cy:y-6, r:6, fill:'#4ea36a' }));
  g.append(el('circle', { cx:x-4.5, cy:y-2, r:4.5, fill:'#3f8f5b' }));
  g.append(el('circle', { cx:x+4.5, cy:y-2, r:4.5, fill:'#5cb97c' }));
  return g;
}

/* ═════════ AGENT SURATI ═════════ */
let kesimN = 0;
/** Yumaloq surat — tana yo'q, faqat yuz. Surat bo'lmasa chizma. */
function portret(q, R = 30) {
  const g = el('g');
  const s = R / 30;
  const kid = 'kesim' + (++kesimN);
  const in_ = el('g', { transform: `scale(${s})` });

  in_.append(el('circle', { cx:0, cy:0, r:30, fill:q.kiyim, opacity:.14 }));

  if (q.rasm) {
    const d = el('defs');
    const c = el('clipPath', { id:kid });
    c.append(el('circle', { cx:0, cy:0, r:28 }));
    d.append(c);
    // 1:1 qirqim, kadr tepaga surilgan — yuz markazda qolsin
    in_.append(d, el('image', { x:-28, y:-28, width:56, height:56, href:q.rasm,
      preserveAspectRatio:'xMidYMin slice', 'clip-path':`url(#${kid})` }));
  } else {
    const d = el('defs');
    const c = el('clipPath', { id:kid });
    c.append(el('circle', { cx:0, cy:0, r:28 }));
    d.append(c);
    const k = el('g', { 'clip-path':`url(#${kid})` });
    k.append(el('path', { d:'M-26 34 C-26 16 -12 10 0 10 C12 10 26 16 26 34 Z', fill:q.kiyim }));
    k.append(el('path', { d:'M-19 -4 C-21 12 -17 20 -13 24 L13 24 C17 20 21 12 19 -4 Z', fill:q.soch }));
    k.append(el('path', { d:'M-5 -2 L-5 11 C-5 14 5 14 5 11 L5 -2 Z', fill:q.teri }));
    k.append(el('path', { d:'M-14 -8 C-14 -22 -9 -28 0 -28 C9 -28 14 -22 14 -8 C14 3 8 11 0 11 C-8 11 -14 3 -14 -8 Z', fill:q.teri }));
    k.append(el('circle', { cx:-14, cy:-6, r:3, fill:q.teri }));
    k.append(el('circle', { cx:14,  cy:-6, r:3, fill:q.teri }));
    k.append(oldSoch(q));
    k.append(el('path', { d:'M-10 -14 Q-6.5 -16.4 -3 -14.6', stroke:q.soch, 'stroke-width':1.7, fill:'none', 'stroke-linecap':'round' }));
    k.append(el('path', { d:'M3 -14.6 Q6.5 -16.4 10 -14', stroke:q.soch, 'stroke-width':1.7, fill:'none', 'stroke-linecap':'round' }));
    for (const cx of [-6.4, 6.4]) {
      k.append(el('ellipse', { cx, cy:-9, rx:3.1, ry:3.4, fill:'#fff' }));
      k.append(el('circle', { cx, cy:-8.6, r:2, fill:'#4a3a2e' }));
      k.append(el('circle', { cx, cy:-8.6, r:.95, fill:'#1a1118' }));
      k.append(el('circle', { cx:cx+.9, cy:-9.8, r:.6, fill:'#fff' }));
      k.append(el('path', { d:`M${cx-3.3} -11.6 Q${cx} -13.6 ${cx+3.3} -11.6`, stroke:'#30232c', 'stroke-width':1.3, fill:'none', 'stroke-linecap':'round' }));
    }
    k.append(el('path', { d:'M0 -5 L-1.4 -1.2 Q0 -.2 1.4 -1.2', stroke:'#c89a7e', 'stroke-width':1, fill:'none', 'stroke-linecap':'round' }));
    k.append(el('path', { d:'M-3.4 3.6 Q0 2.2 3.4 3.6 Q0 7 -3.4 3.6 Z', fill:'#c4647a' }));
    k.append(el('ellipse', { cx:-9, cy:-1.6, rx:3.2, ry:2, fill:'#e68a8a', opacity:.3 }));
    k.append(el('ellipse', { cx:9,  cy:-1.6, rx:3.2, ry:2, fill:'#e68a8a', opacity:.3 }));
    in_.append(d, k);
  }
  in_.append(el('circle', { cx:0, cy:0, r:29, fill:'none', stroke:q.kiyim, 'stroke-width':2.4, class:'halqa' }));
  g.append(in_);
  return g;
}

function oldSoch(q) {
  const s = el('g'); const c = q.soch;
  if (q.soch_turi === 'uzun') {
    s.append(el('path', { d:'M-15 -8 C-16.6 -26 -9 -32 0 -32 C9 -32 16.6 -26 15 -8 L11.6 -14 C9.6 -22 2 -25 -3.6 -21.4 C-8 -18.6 -11.6 -19.4 -12.6 -13 Z', fill:c }));
    s.append(el('path', { d:'M-15 -8 C-18.6 6 -17.6 16 -15.6 24 L-10.6 24 C-13 14 -13 2 -12.4 -8 Z', fill:c }));
    s.append(el('path', { d:'M15 -8 C18.6 6 17.6 16 15.6 24 L10.6 24 C13 14 13 2 12.4 -8 Z', fill:c }));
  } else if (q.soch_turi === 'tolqin') {
    s.append(el('path', { d:'M-15 -8 C-17 -26 -8 -32 1 -32 C10 -32 17 -25 15 -8 L11.6 -15 C9 -23 0 -26 -5 -22 C-9 -18.6 -12 -18 -13 -12 Z', fill:c }));
    s.append(el('path', { d:'M-15 -8 C-19.6 8 -18 18 -15 25 L-9.6 25 C-13.6 15 -13.6 2 -12.4 -8 Z', fill:c }));
    s.append(el('path', { d:'M15 -8 C19 6 18 15 16 21 L11 21 C13.6 12 13 2 12.4 -8 Z', fill:c }));
    s.append(el('path', { d:'M-10 -25 Q-1 -30 8 -25 Q-1 -27.6 -10 -25 Z', fill:'#fff', opacity:.16 }));
  } else if (q.soch_turi === 'tekis') {
    s.append(el('path', { d:'M-15 -8 C-16 -26 -8 -32 0 -32 C8 -32 16 -26 15 -8 L11.6 -14 C10 -22 5 -25 0 -24.6 C-5 -25 -10 -22 -11.6 -14 Z', fill:c }));
    s.append(el('path', { d:'M-15 -8 C-17 8 -16.6 18 -15.6 26 L-10 26 C-12.6 16 -12.6 2 -12.2 -8 Z', fill:c }));
    s.append(el('path', { d:'M15 -8 C17 8 16.6 18 15.6 26 L10 26 C12.6 16 12.6 2 12.2 -8 Z', fill:c }));
  } else {
    s.append(el('path', { d:'M-15 -9 C-16 -27 -9 -31 0 -31 C9 -31 16 -27 15 -9 L12 -14 C10 -22 2 -24 -3 -21 C-7.6 -18.4 -11.6 -19 -12.6 -14 Z', fill:c }));
    s.append(el('path', { d:'M14 -16 C23 -12 24 2 19 11 C21 1 20 -9 12.6 -11.6 Z', fill:c }));
    s.append(el('circle', { cx:14.6, cy:-14, r:2.6, fill:q.kiyim }));
  }
  return s;
}

/** Bosiladigan agent belgisi: surat + yonida nomi va vazifasi. */
function agentBelgisi(q, x, y, R, matnBilan = true) {
  const g = el('g', { class:'agent-g', tabindex:'0', role:'button',
    'aria-label': q.nom + ' — batafsil' });
  const pr = portret(q, R);
  pr.setAttribute('transform', `translate(${x}, ${y})`);
  g.append(pr);
  if (matnBilan) {
    const it = agentYozuvi(q.nom);
    g.append(el('text', { x:x + R + 9, y:y - 1, class:'agent-n' }, q.nom));
    g.append(el('text', { x:x + R + 9, y:y + 10, class:'agent-r' }, it ? it.target : ''));
    if (it) g.append(el('circle', { cx:x + R + 3, cy:y - 5, r:3, class:'dot-' + it.status }));
  }
  const och = (e) => { e.stopPropagation(); kartaOch(q.nom); };
  g.addEventListener('click', och);
  g.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); och(e); }
  });
  return g;
}
const agentYozuvi = (nom) =>
  BINO.find((x) => x.id === 'agentlar')?.items.find((i) => i.nom === nom) ?? null;

/* ═════════ MA'LUMOT OYNASI ═════════ */
let tipOchiq = false;
function tipKorsat(it, cx, cy) {
  const q = [
    `<div class="tip-h"><span class="tip-n">${it.nom}</span>
       <span class="tip-b b-${it.status}">${SNOM[it.status] ?? it.status}</span></div>`,
    `<div class="tip-r"><span class="tip-k">Turi</span><span class="tip-v">${KIND[it.kind] ?? it.kind}</span></div>`,
    `<div class="tip-r"><span class="tip-k">${it.kind === 'http' ? 'Manzil' : 'Nomi'}</span><span class="tip-v">${it.target}</span></div>`,
  ];
  if (it.http) q.push(`<div class="tip-r"><span class="tip-k">Javob</span><span class="tip-v">HTTP ${it.http}</span></div>`);
  if (it.ms != null) q.push(`<div class="tip-r"><span class="tip-k">Vaqt</span><span class="tip-v">${it.ms} ms</span></div>`);
  if (it.note) q.push(`<div class="tip-note">${it.note}</div>`);
  tip.innerHTML = q.join('');
  tip.classList.add('show');
  tipOchiq = true;

  const r = plan.getBoundingClientRect();
  const k = r.width / W;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(Math.max(8, cx * k - tw / 2), r.width - tw - 8) + 'px';
  const y = cy * k - th - 14;
  tip.style.top = (y < 4 ? cy * k + 22 : y) + 'px';
}
const tipYop = () => { tipOchiq = false; tip.classList.remove('show'); };

/* ═════════ 1-DARAJA: BINO ═════════ */
const TARTIB = ['agentlar', 'kgf', 'subtitr', 'tur', 'crm', 'infra'];
const tartibla = (x) => [...x].sort((a, b) => {
  const ia = TARTIB.indexOf(a.id), ib = TARTIB.indexOf(b.id);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
});

/** Xonalar butun polni to'ldiradi — yo'lak yo'q. */
function xonaJoylari(n) {
  const X0 = 58, X1 = 942, Y0 = 58, Y1 = 588, BO = 22;
  const ust = Math.min(3, Math.max(1, n));
  const qat = Math.ceil(n / ust);
  const w = (X1 - X0 - BO * (ust - 1)) / ust;
  const h = (Y1 - Y0 - BO * (qat - 1)) / qat;
  return Array.from({ length: n }, (_, i) => ({
    x: X0 + (i % ust) * (w + BO),
    y: Y0 + Math.floor(i / ust) * (h + BO),
    w, h,
  }));
}

function binoChiz() {
  asos('DIMON AGENCY — UMUMIY REJA');
  const xonalar = tartibla(BINO);
  const joylar = xonaJoylari(xonalar.length);

  xonalar.forEach((x, xi) => {
    const j = joylar[xi];
    if (!j) return;
    const g = el('g', { class:'room', tabindex:'0', role:'button',
      'aria-label': `${x.nom}, ${x.items.length} ta` });
    g.append(xonaRamka(j, x.rang));
    g.append(el('rect', { x:j.x+16, y:j.y+18, width:j.w-32, height:34, rx:7, class:'plate' }));
    g.append(el('circle', { cx:j.x+30, cy:j.y+35, r:5, class:'dot-' + holatOf(x) }));
    g.append(el('text', { x:j.x+42, y:j.y+32, class:'tag' }, x.nom));
    g.append(el('text', { x:j.x+42, y:j.y+45, class:'sub' }, x.izoh));
    g.append(el('text', { x:j.x+j.w-26, y:j.y+40, 'text-anchor':'end', class:'cnt' }, x.items.length + ' ta'));

    // Loyihalar ro'yxati
    const ustun = j.w > 300 ? 2 : 1;
    const bw = (j.w - 42) / ustun;
    x.items.forEach((it, i) => {
      const sx = j.x + 21 + (i % ustun) * bw;
      const sy = j.y + 64 + Math.floor(i / ustun) * 21;
      if (sy + 19 > j.y + j.h - 56) return;
      g.append(el('rect', { x:sx, y:sy, width:bw - 8, height:18, rx:5, fill:'#f5f7fd',
        stroke:'var(--line)', 'stroke-width':1 }));
      g.append(el('circle', { cx:sx + 9, cy:sy + 9, r:3.2, class:'dot-' + it.status }));
      g.append(el('text', { x:sx + 17, y:sy + 12.5, class:'door-k' }, qisqart(it.nom, bw - 24, 5.2)));
    });

    g.append(el('rect', { x:j.x, y:j.y, width:j.w, height:j.h, rx:9, class:'glass' }));
    g.addEventListener('click', () => kirish(x.id));
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); kirish(x.id); }
    });
    plan.append(g);

    // Shu bo'limda ishlaydigan agentlar — xonaning pastida
    const agentlar = xonaAgentlari(x.id);
    const ay = j.y + j.h - 30;
    agentlar.forEach((q, ai) => {
      plan.append(agentBelgisi(q, j.x + 32 + ai * 46, ay, 17, agentlar.length === 1));
    });
  });

  crumbs.innerHTML = '<b>Bino</b>';
  hint.textContent = 'xonani bosing — ichidagi loyihalar ochiladi';
}

/* ═════════ 2-DARAJA: XONA ═════════ */
function xonaChiz(id) {
  const x = BINO.find(r => r.id === id);
  if (!x) return binoChiz();
  asos(x.nom + ' — ICHKI REJA');

  // Markazda: bo'lim nomi va shu yerda ishlaydigan agentlar
  const m = { x:280, y:196, w:440, h:248 };
  plan.append(el('rect', { x:m.x, y:m.y, width:m.w, height:m.h, rx:14,
    fill:x.rang, opacity:.07 }));
  plan.append(el('rect', { x:m.x+10, y:m.y+10, width:m.w-20, height:m.h-20, rx:10,
    fill:'none', stroke:x.rang, 'stroke-width':1.5, opacity:.22 }));

  plan.append(el('circle', { cx:m.x+26, cy:m.y+32, r:6, class:'dot-' + holatOf(x) }));
  plan.append(el('text', { x:m.x+40, y:m.y+38, style:'font:800 19px var(--f);fill:var(--ink)' }, x.nom));
  plan.append(el('text', { x:m.x+40, y:m.y+55, style:'font:500 11.5px var(--f);fill:var(--ink-3)' },
    x.izoh + ' · ' + x.items.length + ' ta'));
  plan.append(gul(m.x + m.w - 26, m.y + 34));

  const agentlar = xonaAgentlari(x.id);
  agentlar.forEach((q, i) => {
    const ay = m.y + 104 + i * 58;
    if (ay + 30 > m.y + m.h) return;
    plan.append(agentBelgisi(q, m.x + 54, ay, 26, true));
  });

  // Loyihalar devor bo'ylab
  devorJoylari(x.items.length).forEach((p, i) => {
    const it = x.items[i];
    const g = el('g', { class:'door-g', tabindex:'0', role:'button',
      'aria-label': `${it.nom} — ${SNOM[it.status] ?? it.status}` });
    g.append(el('rect', { x:p.x, y:p.y, width:p.w, height:p.h, rx:8, class:'door', filter:'url(#soya)' }));
    g.append(el('rect', { x:p.x, y:p.y, width:4, height:p.h, rx:2, fill:x.rang, opacity:.8 }));
    g.append(el('circle', { cx:p.x + 17, cy:p.y + p.h/2, r:4.5, class:'dot-' + it.status }));
    g.append(el('text', { x:p.x + 29, y:p.y + p.h/2 - 1, class:'door-t' }, qisqart(it.nom, p.w)));
    g.append(el('text', { x:p.x + 29, y:p.y + p.h/2 + 10, class:'door-k' }, KIND[it.kind] ?? it.kind));
    const kor = () => tipKorsat(it, p.x + p.w/2, p.y);
    g.addEventListener('pointerenter', kor);
    g.addEventListener('pointerleave', tipYop);
    g.addEventListener('focus', kor);
    g.addEventListener('blur', tipYop);
    g.addEventListener('click', (e) => { e.stopPropagation(); kor(); });
    plan.append(g);
  });

  crumbs.innerHTML = '<button type="button" id="orqaga">Bino</button><span>/</span><b>' + x.nom + '</b>';
  document.getElementById('orqaga').addEventListener('click', chiqish);
  hint.textContent = 'loyiha ustiga kursorni olib boring — holati ko’rinadi';
}

function devorJoylari(n) {
  const DW = 186, DH = 38;
  const tomon = [[], [], [], []];
  for (let i = 0; i < n; i++) tomon[i % 4].push(i);
  const out = [];
  const qator = (list, fn) => list.forEach((idx, k) => { out[idx] = fn(k, list.length); });
  qator(tomon[0], (k, m) => ({ x:280 + (440/m)*k + (440/m - Math.min(DW, 440/m - 10))/2, y:68,
    w:Math.min(DW, 440/m - 10), h:DH }));
  qator(tomon[2], (k, m) => ({ x:280 + (440/m)*k + (440/m - Math.min(DW, 440/m - 10))/2, y:534,
    w:Math.min(DW, 440/m - 10), h:DH }));
  qator(tomon[1], (k, m) => ({ x:758, y:124 + (392/m)*k + (392/m - DH)/2, w:DW, h:DH }));
  qator(tomon[3], (k, m) => ({ x:56,  y:124 + (392/m)*k + (392/m - DH)/2, w:DW, h:DH }));
  return out;
}
const qisqart = (s, w, px = 5.5) => {
  const max = Math.floor((w - 36) / px);
  return s.length > max ? s.slice(0, Math.max(1, max - 1)) + '…' : s;
};

/* ═════════ AGENT KARTASI ═════════ */
const kFon = document.getElementById('karta-fon');
const kKarta = document.getElementById('karta');

function kartaOch(nom) {
  const it = agentYozuvi(nom);
  const q = QIZLAR.find((z) => z.nom === nom);
  if (!it || !q) return;
  let rasm;
  if (q.rasm) {
    rasm = `<img class="karta-rasm" src="${q.rasm}" alt="${nom}">`;
  } else {
    const sv = el('svg', { class:'karta-rasm', viewBox:'-34 -34 68 68', 'aria-hidden':'true' });
    sv.append(portret(q, 32));
    rasm = new XMLSerializer().serializeToString(sv);
  }
  kKarta.innerHTML =
    '<button class="karta-x" type="button" aria-label="Yopish">&times;</button>' + rasm +
    `<div class="karta-n">${nom}</div>` +
    `<div class="karta-r">${it.target}</div>` +
    `<span class="karta-b b-${it.status}">${SNOM[it.status] ?? it.status}</span>` +
    `<div class="karta-v">${kartaIzoh(it)}</div>`;
  kKarta.querySelector('.karta-x').addEventListener('click', kartaYop);
  kFon.classList.add('show');
  kKarta.querySelector('.karta-x').focus();
}
function kartaIzoh(it) {
  if (it.note) return `Hali ishga tushmagan — <b>${it.note}</b>.`;
  if (it.at) {
    return 'Oxirgi ish: <b>' +
      new Date(it.at).toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' }) + '</b>';
  }
  return 'Ishlab turibdi.';
}
const kartaYop = () => kFon.classList.remove('show');
kFon.addEventListener('click', (e) => { if (e.target === kFon) kartaYop(); });

/* ═════════ O'TISHLAR ═════════ */
let daraja = 'bino';
const kirish = (id) => { daraja = id; tipYop(); xonaChiz(id); };
const chiqish = () => { daraja = 'bino'; tipYop(); binoChiz(); };

addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (kFon.classList.contains('show')) kartaYop();
  else if (daraja !== 'bino') chiqish();
});
stage.addEventListener('click', (e) => { if (e.target === plan) tipYop(); });
addEventListener('resize', () => { if (tipOchiq) tipYop(); });

/* ═════════ JONLI MA'LUMOT ═════════ */
let oxirgiXato = null;
async function yangila() {
  try {
    const r = await fetch('/api/holat', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    BINO = d.xonalar;
    for (const q of QIZLAR) q.rasm = d.avatarlar?.[q.nom.toLowerCase()] ?? null;
    oxirgiXato = null;
    vaqtniKorsat(d.yangilandi);
  } catch (e) {
    oxirgiXato = e.message;
    vaqtniKorsat(null);
  }
  if (daraja === 'bino' || !BINO.some(x => x.id === daraja)) { daraja = 'bino'; binoChiz(); }
  else xonaChiz(daraja);
}
function vaqtniKorsat(ts) {
  const e = document.getElementById('vaqt');
  if (oxirgiXato) { e.textContent = 'ulanmadi — ' + oxirgiXato; e.style.color = 'var(--err)'; return; }
  e.textContent = 'yangilandi ' +
    new Date(ts).toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' });
  e.style.color = '';
}

yangila();
setInterval(yangila, 60_000);
